<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="/Login/style.css">
</head>
<body>
    <div class="background">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>

        <div class="login-container">
            <div class="login-card">
                <div class="logo">
                <div class="logo-icon">👨‍🔧</div>
                    <h1>SIG - ETECPJ</h1>
                    <p>acesse a sua conta</p>
                </div>
                <form id="LoginForm">
                    <div class="input-group">
                        <label for="e-mail">e-mail</label>
                        <div class="input-box">
                            <span>✉️</span>
                            <input type="e-mail" id="email" placeholder="Digite seu e-mail" required>
                        </div>
                    </div>  
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <div class="input-box">
                            <span>🔒</span>
                            <input type="password" id="senha" placeholder="Digite a sua senha" required>
                            <button type="button" id="togglePassword" class="toggle-password">

                            </button>
                        </div>
                    </div>    

                </form>

            </div>
        </div>

    </div>
    

    <script type="text/javascript" src="/Login/script.js"></script>
</body>
</html>
